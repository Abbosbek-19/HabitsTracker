version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dailytasktracker-postgres
    environment:
      POSTGRES_DB: DailyTaskTrackerDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/DailyTaskTracker.API/Dockerfile
    container_name: dailytasktracker-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=DailyTaskTrackerDb;Username=postgres;Password=postgrespassword
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/daily-task-tracker
      dockerfile: Dockerfile
    container_name: dailytasktracker-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
